spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}

whatsapp:
  # Sem default em producao: e o segredo que autentica o webhook (HMAC),
  # ainda que a integracao real da Meta so chegue na Fase 6-META.
  webhook-secret: ${WHATSAPP_WEBHOOK_SECRET}

logging:
  level:
    com.barbearia: INFO
