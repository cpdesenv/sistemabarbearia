spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rate-limit:
    login:
      tentativas: 3
      janela-minutos: 1
    whatsapp:
      # Alto o bastante para nao interferir em testes funcionais (o bucket e'
      # compartilhado entre todos os metodos de uma mesma classe de teste,
      # via o mesmo IP simulado) — o comportamento de rate limiting em si e'
      # testado isoladamente com um valor baixo (ver WhatsAppRateLimitingIntegrationTest).
      requisicoes: 1000
      janela-minutos: 1

whatsapp:
  outbox-intervalo-ms: 999999999
  simulacao-status-delay-ms: 999999999

logging:
  level:
    com.barbearia: DEBUG
