spring:
  application:
    name: sistema-barbearia
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-nao-use-em-producao-troque-este-valor-0123456789}
    access-token-ttl-minutos: ${JWT_ACCESS_TTL_MINUTOS:15}
    refresh-token-ttl-dias: ${JWT_REFRESH_TTL_DIAS:7}
  rate-limit:
    login:
      tentativas: 5
      janela-minutos: 1
    whatsapp:
      requisicoes: 60
      janela-minutos: 1
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:barbearia}
      secret-key: ${MINIO_ROOT_PASSWORD:barbearia123}
      bucket: ${MINIO_BUCKET_COMPROVANTES:comprovantes}
  calendar:
    # "mock" (padrao) nao chama o Google de verdade — usado em dev/teste sem
    # nenhuma credencial. So vira "google" quando o cliente tiver uma conta
    # Google Cloud configurada (ver docs/prd-sistema-barbearia.md, Fase 8).
    gateway: ${CALENDAR_GATEWAY:mock}
    outbox-intervalo-ms: ${CALENDAR_OUTBOX_INTERVALO_MS:30000}
    frontend-callback-uri: ${CALENDAR_FRONTEND_CALLBACK_URI:http://localhost:4200/configuracoes/integracoes/google-calendar}
    # Chave AES-256 (base64, 32 bytes) para criptografar o refresh token antes
    # de salvar no banco. O valor abaixo e so para dev/teste — TROQUE em producao.
    token-encryption-key: ${CALENDAR_TOKEN_ENCRYPTION_KEY:ZGV2LW5hby11c2UtZW0tcHJvZHVjYW8tdHJvcXVlMDE=}
    google:
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/integracoes/google-calendar/callback}
  ia:
    # "mock" (padrao) nunca chama a API da Anthropic — LLM deterministico usado
    # em dev/teste (Fase 10). So vira "anthropic" com uma ANTHROPIC_API_KEY de
    # verdade configurada.
    gateway: ${IA_GATEWAY:mock}
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${IA_MODELO:claude-sonnet-5}
    preco-entrada-por-milhao-usd: ${IA_PRECO_ENTRADA_USD:2.0}
    preco-saida-por-milhao-usd: ${IA_PRECO_SAIDA_USD:10.0}
    cotacao-usd-brl: ${IA_COTACAO_USD_BRL:5.5}
    max-iteracoes-ferramentas: ${IA_MAX_ITERACOES_FERRAMENTAS:8}
    timeout-contexto-minutos: ${IA_TIMEOUT_CONTEXTO_MINUTOS:30}

whatsapp:
  # "mock" (padrao) nunca chama nenhum provedor real — usado em dev/teste sem
  # nenhuma credencial da Meta (Fase 9). A implementacao real (Cloud API) so
  # entra na Fase 6-META, sob pedido explicito.
  gateway: ${WHATSAPP_GATEWAY:mock}
  webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:dev-somente-troque-em-producao}
  outbox-intervalo-ms: ${WHATSAPP_OUTBOX_INTERVALO_MS:5000}
  simulacao-status-delay-ms: ${WHATSAPP_SIMULACAO_STATUS_DELAY_MS:10000}
