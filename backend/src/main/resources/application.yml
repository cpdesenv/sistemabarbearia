spring:
  application:
    name: sistema-barbearia
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-nao-use-em-producao-troque-este-valor-0123456789}
    access-token-ttl-minutos: ${JWT_ACCESS_TTL_MINUTOS:15}
    refresh-token-ttl-dias: ${JWT_REFRESH_TTL_DIAS:7}
  rate-limit:
    login:
      tentativas: 5
      janela-minutos: 1
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:barbearia}
      secret-key: ${MINIO_ROOT_PASSWORD:barbearia123}
      bucket: ${MINIO_BUCKET_COMPROVANTES:comprovantes}
