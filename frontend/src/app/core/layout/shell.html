<div class="shell">
  <mat-toolbar color="primary" class="topbar">
    <span class="topbar__titulo">Sistema para Barbearia</span>
    <span class="topbar__espaco"></span>
    @if (usuario(); as usuarioLogado) {
      <span class="topbar__usuario">{{ usuarioLogado.nome }}</span>
      <button mat-stroked-button (click)="sair()">Sair</button>
    }
  </mat-toolbar>

  <div class="shell__corpo">
    <nav class="sidebar">
      @for (item of itensMenu(); track item.rota) {
        <a class="sidebar__item" [routerLink]="item.rota" routerLinkActive="sidebar__item--ativo">
          {{ item.rotulo }}
        </a>
      }
    </nav>

    <main class="conteudo">
      <router-outlet />
    </main>
  </div>
</div>
