services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-barbearia}
      POSTGRES_USER: ${DB_USER:-barbearia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barbearia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barbearia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-barbearia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-barbearia123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-barbearia}
      DB_USER: ${DB_USER:-barbearia}
      DB_PASSWORD: ${DB_PASSWORD:-barbearia}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-nao-use-em-producao-troque-este-valor-0123456789}
      JWT_ACCESS_TTL_MINUTOS: ${JWT_ACCESS_TTL_MINUTOS:-15}
      JWT_REFRESH_TTL_DIAS: ${JWT_REFRESH_TTL_DIAS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-barbearia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-barbearia123}
      MINIO_BUCKET_COMPROVANTES: ${MINIO_BUCKET_COMPROVANTES:-comprovantes}
      CALENDAR_GATEWAY: ${CALENDAR_GATEWAY:-mock}
      # Precisa do MESMO default (dev-safe) do application.yml: como esta chave e'
      # sempre declarada aqui, um fallback vazio sobrescreveria o default do Spring
      # com uma string vazia (que nao decodifica pra 32 bytes e derruba o backend).
      CALENDAR_TOKEN_ENCRYPTION_KEY: ${CALENDAR_TOKEN_ENCRYPTION_KEY:-ZGV2LW5hby11c2UtZW0tcHJvZHVjYW8tdHJvcXVlMDE=}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      CALENDAR_FRONTEND_CALLBACK_URI: ${CALENDAR_FRONTEND_CALLBACK_URI:-}
      WHATSAPP_GATEWAY: ${WHATSAPP_GATEWAY:-mock}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-dev-somente-troque-em-producao}
      IA_GATEWAY: ${IA_GATEWAY:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-claude-sonnet-5}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
