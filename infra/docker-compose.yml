services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-barbearia}
      POSTGRES_USER: ${DB_USER:-barbearia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barbearia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barbearia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-barbearia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-barbearia123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-barbearia}
      DB_USER: ${DB_USER:-barbearia}
      DB_PASSWORD: ${DB_PASSWORD:-barbearia}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
